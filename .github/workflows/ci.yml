name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # needed for OIDC login to AWS
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  terraform:
    name: Terraform fmt, validate, plan
    runs-on: ubuntu-latest
    needs: test
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}   # referenced so GitHub masks it in logs
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=60s